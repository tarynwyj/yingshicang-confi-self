name: validate-config

on:
  push:
    paths:
      - "config.json"
      - "multi.json"
      - "live.m3u"
      - "scripts/check_sources.py"
      - ".github/workflows/update-config.yml"
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate file formats
        run: python scripts/check_sources.py

      - name: Check public URLs
        if: ${{ vars.ENABLE_NETWORK_CHECK == 'true' }}
        run: python scripts/check_sources.py --network
