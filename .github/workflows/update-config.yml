name: update-and-check

on:
  push:
    branches: [main]
    paths:
      - "*.json"
      - "*.m3u"
      - "scripts/**"
      - "tests/**"
      - "upstream/**"
      - ".github/workflows/update-config.yml"
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      check_streams:
        description: Also check every live channel manifest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: config-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests and local validation
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_sources.py
      - name: Refresh upstream without deleting historical entries
        id: sync
        run: python scripts/run_maintenance_check.py sync
      - name: Rebuild and validate
        run: |
          python scripts/build_tel.py
          python scripts/build_all.py
          python scripts/check_sources.py
      - name: Publish validated playlist updates only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- upstream/ipv6.m3u upstream/itv.m3u upstream/cn.m3u upstream/hk.m3u upstream/tel.m3u upstream/all.m3u
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh playlists without deleting historical channels"
            git push origin HEAD:main
          fi
      - name: Check warehouse and configuration entrypoints
        id: health
        env:
          CHECK_STREAMS: ${{ inputs.check_streams || false }}
        run: |
          if [ "$CHECK_STREAMS" = true ]; then
            python scripts/run_maintenance_check.py health --streams
          else
            python scripts/run_maintenance_check.py health
          fi
      - name: Evaluate new VOD candidates
        if: github.event_name == 'push'
        run: python scripts/check_candidate_sources.py source-checks/2026-10-09-candidates.json
      - name: Keep dated health and sync reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-reports-${{ github.run_id }}
          path: reports/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Maintenance completed
        if: success()
        run: echo "Maintenance passed. External-source warnings are recorded in the job summary and report artifact."
